[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aso-node-recovery"
version = "1.0.4"
description = "Safety-first on-demand recovery controller for remote 3X-UI nodes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "ASO" }]
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.48,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "httpx>=0.28,<1",
  "SQLAlchemy>=2.0.50,<3",
  "alembic>=1.18,<2",
  "asyncpg>=0.30,<1",
  "asyncssh>=2.21,<3",
  "python-telegram-bot[job-queue]>=22,<23",
  "APScheduler>=3.11,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.16.8,<0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "production: requires explicitly authorized real production infrastructure",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
