services:
  api:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      ASO_ENVIRONMENT: ${ASO_ENVIRONMENT:-development}
      ASO_LOG_LEVEL: ${ASO_LOG_LEVEL:-INFO}
      ASO_LOG_JSON: ${ASO_LOG_JSON:-true}
      ASO_DRY_RUN: ${ASO_DRY_RUN:-true}
    ports:
      - "${ASO_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aso}
      POSTGRES_USER: ${POSTGRES_USER:-aso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aso_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aso_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aso} -d ${POSTGRES_DB:-aso}"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  aso_postgres_data:
